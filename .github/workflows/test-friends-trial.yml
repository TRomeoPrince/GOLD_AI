name: Test 14-day AZT Friends distributor expiry

on:
  workflow_dispatch:
  push:
    branches:
      - feature/azt-friends-14day-trial-20261116

jobs:
  test-friends:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install owner server dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt httpx
      - name: Test owner trial activation and HTTP authorization cutoff
        run: python -m unittest tests.test_distributor_trials tests.test_distributor_trial_http -v
