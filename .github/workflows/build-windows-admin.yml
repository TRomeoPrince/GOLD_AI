name: Build AZT Admin EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "broker/**"
      - "strategies/**"
      - "tests/**"
      - "IMAGES/**"
      - "config.py"
      - "requirements*.txt"
      - "build/GOLD_AI_Admin.spec"
      - ".github/workflows/build-windows-admin.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run isolated owner tests
        shell: cmd
        run: |
          python -m unittest discover -s tests -q

      - name: Build AZT_Admin.exe
        shell: cmd
        run: |
          python -m PyInstaller --clean --noconfirm --distpath dist --workpath build\admin_pyi build\GOLD_AI_Admin.spec

      - name: Upload Admin EXE
        uses: actions/upload-artifact@v4
        with:
          name: AZT-Admin-Windows
          path: dist/AZT_Admin.exe
          if-no-files-found: error
          retention-days: 90
