name: AZT Pullback and M15 entry regressions (integrated)
on:
  push:
    branches:
      - fix/azt-reliability-plus-pullback-m15-20261123
    paths:
      - "strategies/**"
      - "backtesting/**"
      - "tests/test_pullback_m15_execution.py"
      - ".github/workflows/test-entry-regressions.yml"
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pure calculation dependencies
        run: python -m pip install pandas
      - name: Run isolated regression tests (no MT5 and no orders)
        run: python -m unittest discover -s tests -p test_pullback_m15_execution.py -v
