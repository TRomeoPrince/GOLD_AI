name: AZT Pullback and M15 entry regressions

on:
  push:
    branches:
      - fix/pullback-trend-and-m15-executable-entry-20261123
    paths:
      - "strategies/**"
      - "backtesting/**"
      - "tests/test_pullback_m15_execution.py"
      - ".github/workflows/test-entry-regressions.yml"

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install calculation dependencies only
        run: python -m pip install pandas
      - name: Run isolated, no-MT5, no-trade regressions
        run: python -m unittest discover -s tests -p test_pullback_m15_execution.py -v
