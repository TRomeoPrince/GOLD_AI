name: Build AZT Mini Trial (Windows)
on:
  workflow_dispatch:
  push:
    branches: [feature/azt-mini-trial-20261110]
    paths:
      - "mini_trial/**"
      - "build/AZT_Mini_Trial.*"
      - "server/personal_worker.py"
      - "broker/mt5_client.py"
      - "tests/test_mini_trial.py"
      - ".github/workflows/build-azt-mini-trial.yml"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-build.txt
      - name: Offline Mini tests
        run: python -m unittest discover -s tests -p "test_mini_trial.py" -v
      - name: Build Mini EXE
        run: python -m PyInstaller --clean --noconfirm --distpath dist_mini --workpath build/mini_pyi build/AZT_Mini_Trial.spec
      - name: Verify frozen imports without touching broker
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist_mini/AZT_Mini_Trial.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--verify-bundle" -Wait -PassThru
          if ($process.ExitCode -ne 0) { if (Test-Path mini_verify_error.log) { Get-Content mini_verify_error.log }; throw "Frozen Mini import check failed, exit $($process.ExitCode)" }
      - name: Check EXE exists and record hash
        shell: pwsh
        run: |
          if (!(Test-Path "dist_mini/AZT_Mini_Trial.exe")) { throw "Missing Mini exe" }
          Get-FileHash "dist_mini/AZT_Mini_Trial.exe" -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: AZT-Mini-Trial-EXE
          path: dist_mini/AZT_Mini_Trial.exe
          if-no-files-found: error
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Package Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "build/AZT_Mini_Trial.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash "dist_mini/AZT_Mini_Trial_Setup.exe" -Algorithm SHA256
      - name: Smoke-test silent install and external expiry uninstaller
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "AZT-Mini-InstallSmoke"
          $setup = (Resolve-Path "dist_mini/AZT_Mini_Trial_Setup.exe").Path
          $proc = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOICONS", "/DIR=$target") -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Silent Mini install failed: $($proc.ExitCode)" }
          foreach ($file in @("AZT_Mini_Trial.exe", "expire_uninstall.cmd", "unins000.exe")) {
            if (!(Test-Path (Join-Path $target $file))) { throw "Missing installed file: $file" }
          }
          & (Join-Path $target "expire_uninstall.cmd")
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $target "AZT_Mini_Trial.exe")) { throw "Mini uninstall helper left application installed" }
          Write-Host "Installer and delayed uninstall helper passed without starting MT5."
      - uses: actions/upload-artifact@v4
        with:
          name: AZT-Mini-Trial-Setup
          path: dist_mini/AZT_Mini_Trial_Setup.exe
          if-no-files-found: error
          retention-days: 30
