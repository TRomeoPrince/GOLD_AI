name: Historical Gold structural trailing at 1R activation
on:
  push:
    branches:
      - experiments/structure-break-candle-trailing
    paths:
      - .github/workflows/structure-trailing-1r.yml
  workflow_dispatch:
jobs:
  verify-1r:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pandas numpy
      - name: Fetch independent published M5 history
        run: |
          python - <<'PY'
          from urllib.request import urlretrieve
          from pathlib import Path
          import pandas as pd
          dest=Path("data/public_gold_m5.csv")
          dest.parent.mkdir(exist_ok=True)
          urlretrieve("https://raw.githubusercontent.com/Sai310421/xauusd-data/main/csv/XAUUSD/XAUUSD_M5_2026Q1Q2.csv",dest)
          f=pd.read_csv(dest).rename(columns={"datetime":"time"}).tail(5200)
          print("PERIOD:",f.time.iloc[0],f.time.iloc[-1],flush=True)
          f.to_csv(dest,index=False)
          PY
      - name: Run trailing with 1R activation
        run: python -m research.structure_break_experiment --csv data/public_gold_m5.csv --market GOLD --warmup 300 --history-window 180 --max-hold 60 --balance 1000 --risk-pct 0.9 --activate-r 1 --buffer-atr 0.15 --cost-price 0.50 --output Reports/public_gold_1r
      - name: Show paired result
        run: |
          python - <<'PY'
          import pandas as pd
          t=pd.read_csv("Reports/public_gold_1r/paired_trades.csv")
          s=pd.read_csv("Reports/public_gold_1r/summary.csv")
          print(t.groupby("mode").agg(trades=("r_multiple","size"),net_r=("r_multiple","sum"),win_rate=("r_multiple",lambda x:100*(x>0).mean()),avg_r=("r_multiple","mean"),trails=("trail_updates","sum")).to_string(),flush=True)
          print(s.to_string(index=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gold-trailing-1r-historical
          path: Reports/public_gold_1r/*.csv
          retention-days: 14
