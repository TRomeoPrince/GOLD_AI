name: Quick M5 S-R confirmation validation
on:
  push:
    branches:
      - experiments/sr-m5-confirmation-quick-20261103
  workflow_dispatch:
jobs:
  quick-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pandas numpy
      - name: Test causal entry patterns and opposite lock
        run: python -m unittest discover -s tests -p test_sr_confirmation_research.py -v
      - name: Public XAUUSD M5 data
        run: |
          python - <<'PY'
          from urllib.request import urlretrieve
          from pathlib import Path
          import pandas as pd
          dest=Path("data/gold.csv")
          dest.parent.mkdir(parents=True,exist_ok=True)
          urlretrieve("https://raw.githubusercontent.com/Sai310421/xauusd-data/main/csv/XAUUSD/XAUUSD_M5_2026Q1Q2.csv",dest)
          f=pd.read_csv(dest).tail(12000)
          f.to_csv(dest,index=False)
          print("TIME WINDOW",len(f),f.iloc[0].to_dict(),f.iloc[-1].to_dict(),flush=True)
          PY
      - name: Compare current S/R and confirmed S/R with or without lock
        run: python -u -m research.sr_m5_confirmation_backtest --csv data/gold.csv --limit 12000 --warmup 300 --history 180 --max-hold 60 --cost-price 0.5 --balance 2000 --risk-pct 1 --output Reports/sr_quick
      - name: Test cost sensitivity at price cost 1.0 (no strategy rescanning)
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          from research.sr_m5_confirmation_backtest import summarize
          base=Path("Reports/sr_quick")
          t=pd.read_csv(base/"sr_trades.csv")
          counts=pd.read_csv(base/"sr_counts.csv")
          t["net_r"]=t["net_r"]-0.5/t["initial_risk_price"]
          summary=summarize(t,counts,balance=2000,risk_pct=1.)
          summary.to_csv(base/"sr_summary_cost1.csv",index=False)
          print("ALTERNATE HIGHER EXECUTION PRICE COST (1.00 vs 0.50):")
          print(summary.to_string(index=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SR-M5-Confirmation-Quick-Results
          path: Reports/sr_quick/*.csv
          retention-days: 21
