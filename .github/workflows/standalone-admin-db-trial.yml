name: AZT standalone Admin DB and UTC distributor-trial checks
on:
  push:
    branches: [fix/frozen-signal-pandas-20261103]
  workflow_dispatch:
jobs:
  validate-and-build-owner:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install AZT owner runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt pyinstaller python-dotenv httpx
      - name: Compile and test local owner data persistence and UTC trial
        run: |
          python -m py_compile server/store.py server/admin_launcher.py server/azt_store.py server/app.py server/trial_licenses.py
          python -m unittest discover -s tests -p test_standalone_admin_db.py -v
          python -m unittest discover -s tests -p test_distributor_trials.py -v
          python -m unittest discover -s tests -p test_distributor_trial_http.py -v
      - name: Build standalone AZT Admin
        run: python -m PyInstaller --clean --noconfirm --distpath dist_trial_fixed --workpath build/trial_admin_pyi build/GOLD_AI_Admin.spec
      - name: Verify signal-engine imports inside frozen Admin EXE (no MT5 orders)
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'azt_signal_bundle_verified.txt'
          $env:AZT_SIGNAL_BUNDLE_PROBE = $probe
          # GUI-subsystem EXEs return control to the shell immediately; use a
          # Process handle to wait for the actual frozen Python worker's exit.
          $exe = (Resolve-Path ".\\dist_trial_fixed\\AZT_Admin.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList '--verify-signal-bundle' -PassThru
          if (-not $p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "Frozen Admin import verification timed out."
          }
          if (Test-Path "$probe.error") { Get-Content "$probe.error" }
          if ($p.ExitCode -ne 0) { throw "Packaged signal-engine import check failed ($($p.ExitCode))." }
          if (-not (Test-Path $probe)) { throw "Packaged signal-engine verification did not write success proof." }
          Get-Content $probe
      - name: Upload fixed Admin executable
        uses: actions/upload-artifact@v4
        with:
          name: AZT-Admin-Standalone-DB-Fixed
          path: dist_trial_fixed/AZT_Admin.exe
          if-no-files-found: error
          retention-days: 30
